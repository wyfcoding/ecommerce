# File Service Configuration

[server]
name = "file"
environment = "dev"
version = "v1.0.0"

[server.http]
port = 8020
timeout = "30s"

[server.grpc]
port = 9020
timeout = "30s"

[log]
level = "info"
format = "json"

[data]
[data.database]
driver = "mysql"
source = "root:root@tcp(127.0.0.1:3306)/ecommerce_file?charset=utf8mb4&parseTime=True&loc=Local"
max_idle_conns = 10
max_open_conns = 100
conn_max_lifetime = "1h"

[data.redis]
addr = "127.0.0.1:6379"
password = "redis_password"
db = 0

[ratelimit]
rate = 100
burst = 20

[circuit_breaker]
[circuit_breaker.thresholds]
error_rate = 0.5
min_requests = 10
timeout = "10s"

[minio]
endpoint = "127.0.0.1:9000"
access_key_id = "minioadmin"
secret_access_key = "minioadmin"
use_ssl = false
bucket_name = "ecommerce-assets"
