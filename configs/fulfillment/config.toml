# 履约服务配置文件
[server]
http_port = 8081
grpc_port = 9081
read_timeout = "15s"
write_timeout = "15s"
shutdown_timeout = "30s"

[database]
dsn = "${MYSQL_DSN:root:password@tcp(localhost:3306)/fulfillment?charset=utf8mb4&parseTime=True&loc=Local}"
max_open_conns = 100
max_idle_conns = 10
conn_max_lifetime = "1h"

[redis]
addr = "${REDIS_ADDR:localhost:6379}"
db = 1
pool_size = 100

[kafka]
brokers = ["${KAFKA_BROKER:localhost:9092}"]
group_id = "fulfillment-service"
topics = ["fulfillment.events"]

[log]
level = "${LOG_LEVEL:info}"
format = "json"

[fulfillment]
# 自动分配拣货任务
auto_assign_picking = true
# 优先级策略
priority_strategy = "fifo"
# 拣货超时告警 (分钟)
picking_timeout_minutes = 120
