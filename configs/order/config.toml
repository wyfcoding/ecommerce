# 变更说明：补充分片示例、Redis addrs 与 Elasticsearch 读模型说明。
# 假设：分片与 ES/Redis 参数将在部署时替换为真实值。
version = "1.0.0"

[server]
name = "order"
environment = "dev"

[server.http]
addr = "0.0.0.0"
port = 8002
timeout = "3s"
read_timeout = "3s"
write_timeout = "3s"
idle_timeout = "60s"

[server.grpc]
addr = "0.0.0.0"
port = 9002
timeout = "3s"
max_recv_msg_size = 10485760
max_send_msg_size = 10485760
max_concurrent_streams = 100

[log]
level = "info"
format = "json"
output = "stdout"
file = "logs/order.log"
max_size = 100
max_backups = 3
max_age = 28
compress = true

[tracing]
enabled = true
service_name = "order"
otlp_endpoint = "localhost:4317"

[metrics]
enabled = true
port = "18002"
path = "/metrics"

[jwt]
secret = "ecommerce-secret-key"
issuer = "ecommerce"
expire_duration = "24h"

[snowflake]
type = "snowflake"
start_time = "2024-01-01"
machine_id = 3

[ratelimit]
enabled = true
rate = 100
burst = 20

[circuitbreaker]
enabled = true
timeout = "1s"
max_requests = 1
interval = "5s"

[cache]
prefix = "order:"
default_expiration = "1h"
cleanup_interval = "10m"

[lock]
prefix = "order:lock:"
default_expiration = "10s"
max_retries = 3
retry_delay = "100ms"

# 单库配置（默认启用）。
[data.database]
driver = "mysql"
dsn = "root:root@tcp(127.0.0.1:3306)/ecommerce_order?charset=utf8mb4&parseTime=True&loc=Local"
max_idle_conns = 10
max_open_conns = 100
conn_max_lifetime = "1h"
slow_threshold = "200ms"
log_level = 4

# 分片示例（按需启用，取消注释即可生效）。
# [[data.shards]]
# driver = "mysql"
# dsn = "root:root@tcp(127.0.0.1:3307)/ecommerce_order_0?charset=utf8mb4&parseTime=True&loc=Local"
# max_idle_conns = 10
# max_open_conns = 100
# conn_max_lifetime = "1h"
# slow_threshold = "200ms"
# log_level = 4
#
# [[data.shards]]
# driver = "mysql"
# dsn = "root:root@tcp(127.0.0.1:3308)/ecommerce_order_1?charset=utf8mb4&parseTime=True&loc=Local"
# max_idle_conns = 10
# max_open_conns = 100
# conn_max_lifetime = "1h"
# slow_threshold = "200ms"
# log_level = 4

[data.redis]
# 读模型缓存（订单详情与订单号映射），支持单机/哨兵/集群。
# addr 为历史字段，推荐使用 addrs。
# addr = "127.0.0.1:6379"
addrs = ["127.0.0.1:6379"]
password = "redis_password"
db = 0
pool_size = 10
min_idle_conns = 5
read_timeout = "0.2s"
write_timeout = "0.2s"

[data.elasticsearch]
# 订单搜索读模型索引，默认索引名为 orders（在代码中定义）。
addresses = ["http://127.0.0.1:9200"]
username = "elastic"
password = "elastic_password"

[messagequeue.kafka]
brokers = ["localhost:9092"]
topic = "order-events"
group_id = "order-group"
dial_timeout = "10s"
read_timeout = "10s"
write_timeout = "10s"
min_bytes = 1024
max_bytes = 10485760
async = true

[minio]
endpoint = "127.0.0.1:9000"
access_key_id = "minioadmin"
secret_access_key = "minioadmin"
use_ssl = false
bucket_name = "ecommerce-assets"

[services]
[services.warehouse]
grpc_addr = "127.0.0.1:9007"
http_addr = "127.0.0.1:8007"
[services.payment]
grpc_addr = "127.0.0.1:9004"
http_addr = "127.0.0.1:8004"
[services.product]
grpc_addr = "127.0.0.1:9003"
http_addr = "127.0.0.1:8003"
