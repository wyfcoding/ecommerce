# 用户服务全局配置版本
version = "1.0.0"

[server]
name = "user"           # 服务名称
environment = "dev"     # 运行环境: dev/test/prod

[server.http]
addr = "0.0.0.0"        # HTTP 监听地址
port = 8001             # HTTP 端口
timeout = "3s"          # 全局请求超时
read_timeout = "3s"     # 读取超时
write_timeout = "3s"    # 写入超时
idle_timeout = "60s"    # 空闲连接超时

[server.grpc]
addr = "0.0.0.0"        # gRPC 监听地址
port = 9001             # gRPC 端口
timeout = "3s"          # gRPC 响应超时
max_recv_msg_size = 10485760    # 最大接收消息大小 (10MB)
max_send_msg_size = 10485760    # 最大发送消息大小 (10MB)
max_concurrent_streams = 100    # 最大并发流数量

[log]
level = "info"          # 日志级别: debug/info/warn/error
format = "json"         # 日志格式: json/text
output = "stdout"       # 输出目标: stdout/file
file = "logs/user.log"  # 日志文件路径
max_size = 100          # 单文件最大 MB
max_backups = 3         # 保留旧文件个数
max_age = 28            # 保留天数
compress = true         # 是否压缩

[tracing]
enabled = true          # 是否开启分布式追踪
service_name = "user"   # 链路中的服务名
otlp_endpoint = "localhost:4317" # OTLP 收集器地址

[metrics]
enabled = true          # 是否开启 Prometheus 指标暴露
port = "18001"          # 指标监控端口
path = "/metrics"       # 指标采集路径

[jwt]
secret = "ecommerce-secret-key" # JWT 签名密钥 (生产环境须通过 ENV 覆盖)
issuer = "ecommerce"            # 令牌签发者
expire_duration = "24h"         # 令牌有效期

[snowflake]
type = "snowflake"      # ID 生成算法
start_time = "2024-01-01"
machine_id = 2          # 节点 ID (1-1023)

[ratelimit]
enabled = true          # 是否开启全局限流
rate = 100              # 每秒允许请求数 (RPS)
burst = 20              # 允许的突发流量

[circuitbreaker]
enabled = true          # 是否开启熔断保护
timeout = "1s"          # 统计窗口时间
max_requests = 1        # 半开状态最大通过请求数
interval = "5s"         # 熔断开启后的冷却重试时间

[cache]
prefix = "product:"        # 缓存键全局前缀
default_expiration = "1h" # 默认过期时间
cleanup_interval = "10m"  # 定期清理过期键的间隔

[lock]
prefix = "product:lock:"   # 分布式锁前缀
default_expiration = "10s"
max_retries = 3         # 竞争锁时的最大重试次数
retry_delay = "100ms"

[data.database]
driver = "mysql"        # 数据库驱动
dsn = "root:root@tcp(127.0.0.1:3306)/ecommerce_product?charset=utf8mb4&parseTime=True&loc=Local" # 数据库连接串
max_idle_conns = 10     # 最大空闲连接
max_open_conns = 100    # 最大打开连接数
conn_max_lifetime = "1h" # 连接生命周期
slow_threshold = "200ms" # 慢查询记录阈值
log_level = 4           # SQL 日志级别 (1:Silent, 2:Error, 3:Warn, 4:Info)

[data.redis]
addr = "127.0.0.1:6379" # Redis 节点地址
password = "redis_password"
db = 0                  # 数据库索引
pool_size = 10          # 连接池大小
min_idle_conns = 5
read_timeout = "0.2s"
write_timeout = "0.2s"

[messagequeue.kafka]
brokers = ["localhost:9092"] # Kafka 集群地址
topic = "user-events"        # 默认生产主题
group_id = "user-group"      # 默认消费组 ID
dial_timeout = "10s"
read_timeout = "10s"
write_timeout = "10s"
min_bytes = 1024
max_bytes = 10485760
async = true                 # 是否异步发送消息

[minio]
endpoint = "127.0.0.1:9000"  # 对象存储接入点
access_key_id = "minioadmin"
secret_access_key = "minioadmin"
use_ssl = false
bucket_name = "ecommerce-assets"

[services]
# 下游微服务注册占位符 (例如 auth = "localhost:9002")
