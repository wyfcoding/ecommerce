# Scheduler Service Configuration

[server]
name = "scheduler"
environment = "dev"
version = "v1.0.0"

[server.http]
port = 8019
timeout = "30s"

[server.grpc]
port = 9019
timeout = "30s"

[log]
level = "info"
format = "json"

[data]
[data.database]
driver = "mysql"
source = "root:root@tcp(127.0.0.1:3306)/ecommerce_scheduler?charset=utf8mb4&parseTime=True&loc=Local"
max_idle_conns = 10
max_open_conns = 100
conn_max_lifetime = "1h"

[data.redis]
addr = "127.0.0.1:6379"
password = "redis_password"
db = 0

[ratelimit]
rate = 100
burst = 20

[circuit_breaker]
[circuit_breaker.thresholds]
error_rate = 0.5
min_requests = 10
timeout = "10s"

[message_queue]
[message_queue.kafka]
brokers = ["localhost:9092"]
topic = "scheduler-events"
group_id = "scheduler-group"
