# Orchestrator Service Configuration

[server]
name = "orchestrator"
environment = "dev"
version = "v1.0.0"

[server.http]
port = 8082
timeout = "30s"

[server.grpc]
port = 9082
timeout = "30s"

[log]
level = "info"
format = "json"

[data]
[data.database]
driver = "mysql"
source = "root:root1234@tcp(127.0.0.1:3306)/ecommerce?charset=utf8mb4&parseTime=True&loc=Local"
max_idle_conns = 10
max_open_conns = 100
conn_max_lifetime = "1h"

[circuit_breaker]
[circuit_breaker.thresholds]
error_rate = 0.5
min_requests = 10
timeout = "10s"
