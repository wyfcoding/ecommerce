# 商家服务配置文件
# 生成假设：
# - MySQL 默认端口 3306
# - Kafka 默认端口 9092
# - Redis 默认端口 6379

[server]
# HTTP 服务端口
http_port = 8080
# gRPC 服务端口
grpc_port = 9080
# 读超时
read_timeout = "15s"
# 写超时
write_timeout = "15s"
# 优雅关停超时
shutdown_timeout = "30s"

[database]
# MySQL DSN
# 格式: user:password@tcp(host:port)/database?charset=utf8mb4&parseTime=True&loc=Local
dsn = "${MYSQL_DSN:root:password@tcp(localhost:3306)/merchant?charset=utf8mb4&parseTime=True&loc=Local}"
# 最大打开连接数
max_open_conns = 100
# 最大空闲连接数
max_idle_conns = 10
# 连接最大生存时间
conn_max_lifetime = "1h"
# 是否开启日志
enable_log = false

[redis]
# Redis 地址
addr = "${REDIS_ADDR:localhost:6379}"
# 密码
password = "${REDIS_PASSWORD:}"
# 数据库
db = 0
# 连接池大小
pool_size = 100

[kafka]
# Kafka Broker 地址
brokers = ["${KAFKA_BROKER:localhost:9092}"]
# 消费者组 ID
group_id = "merchant-service"
# 生产者主题
topics = ["merchant.events"]

[log]
# 日志级别: debug, info, warn, error
level = "${LOG_LEVEL:info}"
# 日志格式: json, text
format = "json"
# 是否输出到文件
output_file = false
# 日志文件路径
file_path = "/var/log/merchant/app.log"
# 日志文件最大大小 (MB)
max_size = 100
# 日志文件最大保留天数
max_age = 7
# 日志文件最大备份数
max_backups = 3

[business]
# 默认佣金费率 (百分比)
default_commission_rate = 0.05
# 默认信用评分
default_credit_score = 60.0
# 商家入驻审核超时天数
application_review_timeout_days = 7
# 自动确认订单默认天数
auto_confirm_order_days = 7

[notification]
# 通知服务地址
service_addr = "${NOTIFICATION_SERVICE_ADDR:localhost:8081}"
# 是否启用通知
enabled = true
# 入驻申请通知模板
application_template = "merchant_application"
# 审核通过通知模板
approved_template = "merchant_approved"
# 审核拒绝通知模板
rejected_template = "merchant_rejected"

[tracing]
# Jaeger Agent 地址
agent_addr = "${JAEGER_AGENT_ADDR:localhost:6831}"
# 服务名
service_name = "merchant-service"
# 采样率
sample_rate = 0.1

[metrics]
# Prometheus 端口
port = 9090
# 指标路径
path = "/metrics"
