syntax = "proto3";

package api.cms.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/wyfcoding/ecommerce/go-api/cms/v1;cmsv1";

// CMSService provides APIs for managing ecommerce content.
service CMSService {
  // Page Management
  rpc CreatePage(CreatePageRequest) returns (Page);
  rpc GetPage(GetPageRequest) returns (Page);
  rpc UpdatePage(UpdatePageRequest) returns (Page);
  rpc DeletePage(DeletePageRequest) returns (google.protobuf.Empty);
  rpc ListPages(ListPagesRequest) returns (ListPagesResponse);
  rpc PublishPage(PublishPageRequest) returns (Page);

  // Template Management
  rpc CreateTemplate(CreateTemplateRequest) returns (Template);
  rpc GetTemplate(GetTemplateRequest) returns (Template);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);

  // Asset Management
  rpc CreateAsset(CreateAssetRequest) returns (Asset);
  rpc GetAsset(GetAssetRequest) returns (Asset);
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc DeleteAsset(DeleteAssetRequest) returns (google.protobuf.Empty);
}

enum PageStatus {
  PAGE_STATUS_UNSPECIFIED = 0;
  DRAFT = 1;
  REVIEWING = 2;
  PUBLISHED = 3;
  ARCHIVED = 4;
}

message Page {
  string id = 1;
  string title = 2;
  string slug = 3;
  string template_id = 4;
  string content_json = 5; // JSON representation of page components
  PageStatus status = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp published_at = 10;
  map<string, string> metadata = 11;
}

message CreatePageRequest {
  string title = 1;
  string slug = 2;
  string template_id = 3;
  string content_json = 4;
  string created_by = 5;
}

message GetPageRequest {
  oneof query {
    string id = 1;
    string slug = 2;
  }
}

message UpdatePageRequest {
  string id = 1;
  string title = 2;
  string content_json = 4;
  PageStatus status = 5;
}

message DeletePageRequest {
  string id = 1;
}

message ListPagesRequest {
  int32 page = 1;
  int32 page_size = 2;
  PageStatus status = 3;
}

message ListPagesResponse {
  repeated Page pages = 1;
  int32 total = 2;
}

message PublishPageRequest {
  string id = 1;
}

message Template {
  string id = 1;
  string name = 2;
  string description = 3;
  string structure_json = 4; // Schema for allowed components
  google.protobuf.Timestamp created_at = 5;
}

message CreateTemplateRequest {
  string name = 1;
  string description = 2;
  string structure_json = 3;
}

message GetTemplateRequest {
  string id = 1;
}

message ListTemplatesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListTemplatesResponse {
  repeated Template templates = 1;
  int32 total = 2;
}

message Asset {
  string id = 1;
  string name = 2;
  string file_type = 3;
  string url = 4;
  int64 size = 5;
  string bucket = 6;
  string key = 7;
  google.protobuf.Timestamp created_at = 8;
}

message CreateAssetRequest {
  string name = 1;
  string file_type = 2;
  string url = 3;
  int64 size = 4;
  string bucket = 5;
  string key = 6;
}

message GetAssetRequest {
  string id = 1;
}

message ListAssetsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string file_type = 3;
}

message ListAssetsResponse {
  repeated Asset assets = 1;
  int32 total = 2;
}

message DeleteAssetRequest {
  string id = 1;
}
