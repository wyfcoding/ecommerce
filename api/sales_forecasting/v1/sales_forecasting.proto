syntax = "proto3";

package api.salesforecasting.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/wyfcoding/ecommerce/go-api/salesforecasting/v1;salesforecastingv1";

service SalesForecastingService {
  rpc CreateForecastModel(CreateForecastModelRequest) returns (ForecastModel);
  rpc GetForecastModel(GetForecastModelRequest) returns (ForecastModel);
  rpc ListForecastModels(ListForecastModelsRequest) returns (ListForecastModelsResponse);
  rpc TrainModel(TrainModelRequest) returns (TrainModelResponse);
  rpc PredictSales(PredictSalesRequest) returns (SalesPrediction);
  rpc GetPrediction(GetPredictionRequest) returns (SalesPrediction);
  rpc ListPredictions(ListPredictionsRequest) returns (ListPredictionsResponse);
  rpc UpdateActualSales(UpdateActualSalesRequest) returns (google.protobuf.Empty);
  rpc GetForecastAccuracy(GetForecastAccuracyRequest) returns (ForecastAccuracy);
  rpc GetDemandForecast(GetDemandForecastRequest) returns (DemandForecast);
}

enum ModelType {
  MODEL_TYPE_UNSPECIFIED = 0;
  MOVING_AVERAGE = 1;
  EXPONENTIAL_SMOOTHING = 2;
  ARIMA = 3;
  PROPHET = 4;
  LSTM = 5;
  ENSEMBLE = 6;
}

enum ModelStatus {
  MODEL_STATUS_UNSPECIFIED = 0;
  DRAFT = 1;
  TRAINING = 2;
  READY = 3;
  FAILED = 4;
}

enum Granularity {
  GRANULARITY_UNSPECIFIED = 0;
  DAILY = 1;
  WEEKLY = 2;
  MONTHLY = 3;
  QUARTERLY = 4;
}

message ForecastModel {
  string id = 1;
  string name = 2;
  string description = 3;
  ModelType model_type = 4;
  ModelStatus status = 5;
  Granularity granularity = 6;
  repeated string product_ids = 7;
  repeated string category_ids = 8;
  int32 lookback_days = 9;
  int32 forecast_days = 10;
  map<string, string> parameters = 11;
  double training_rmse = 12;
  double training_mae = 13;
  google.protobuf.Timestamp last_trained_at = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message CreateForecastModelRequest {
  string name = 1;
  string description = 2;
  ModelType model_type = 3;
  Granularity granularity = 4;
  repeated string product_ids = 5;
  repeated string category_ids = 6;
  int32 lookback_days = 7;
  int32 forecast_days = 8;
  map<string, string> parameters = 9;
}

message GetForecastModelRequest {
  string model_id = 1;
}

message ListForecastModelsRequest {
  ModelStatus status = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListForecastModelsResponse {
  repeated ForecastModel models = 1;
  int32 total = 2;
}

message TrainModelRequest {
  string model_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
}

message TrainModelResponse {
  string model_id = 1;
  ModelStatus status = 2;
  double training_rmse = 3;
  double training_mae = 4;
  string message = 5;
}

message PredictSalesRequest {
  string model_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  repeated string product_ids = 4;
  repeated string category_ids = 5;
  bool include_confidence_interval = 6;
}

message SalesPrediction {
  string id = 1;
  string model_id = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp forecast_start = 4;
  google.protobuf.Timestamp forecast_end = 5;
  repeated PredictionItem items = 6;
  map<string, string> metadata = 7;
}

message PredictionItem {
  string product_id = 1;
  string category_id = 2;
  google.protobuf.Timestamp date = 3;
  double predicted_quantity = 4;
  double predicted_revenue = 5;
  double lower_bound = 6;
  double upper_bound = 7;
  double confidence = 8;
}

message GetPredictionRequest {
  string prediction_id = 1;
}

message ListPredictionsRequest {
  string model_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListPredictionsResponse {
  repeated SalesPrediction predictions = 1;
  int32 total = 2;
}

message UpdateActualSalesRequest {
  string prediction_id = 1;
  repeated ActualSalesItem items = 2;
}

message ActualSalesItem {
  string product_id = 1;
  google.protobuf.Timestamp date = 2;
  double actual_quantity = 3;
  double actual_revenue = 4;
}

message GetForecastAccuracyRequest {
  string model_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
}

message ForecastAccuracy {
  string model_id = 1;
  double mape = 2;
  double rmse = 3;
  double mae = 4;
  double mpe = 5;
  int32 total_predictions = 6;
  google.protobuf.Timestamp calculated_at = 7;
  repeated AccuracyByProduct accuracy_by_product = 8;
}

message AccuracyByProduct {
  string product_id = 1;
  double mape = 2;
  double rmse = 3;
  int32 prediction_count = 4;
}

message GetDemandForecastRequest {
  repeated string product_ids = 1;
  repeated string category_ids = 2;
  int32 forecast_days = 3;
  bool include_seasonality = 4;
  bool include_promotion_effect = 5;
}

message DemandForecast {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp forecast_start = 3;
  google.protobuf.Timestamp forecast_end = 4;
  repeated DemandItem items = 5;
  repeated SeasonalityFactor seasonality_factors = 6;
  repeated PromotionEffect promotion_effects = 7;
}

message DemandItem {
  string product_id = 1;
  google.protobuf.Timestamp date = 2;
  double base_demand = 3;
  double seasonal_adjustment = 4;
  double promotion_adjustment = 5;
  double final_demand = 6;
  double safety_stock = 7;
  double reorder_point = 8;
}

message SeasonalityFactor {
  string period = 1;
  double factor = 2;
  string description = 3;
}

message PromotionEffect {
  string promotion_type = 1;
  double lift_factor = 2;
  int32 duration_days = 3;
}
