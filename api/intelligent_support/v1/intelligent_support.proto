syntax = "proto3";

package api.intelligentsupport.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/wyfcoding/ecommerce/go-api/intelligentsupport/v1;intelligentsupportv1";

service IntelligentSupportService {
  rpc CreateKnowledgeBase(CreateKnowledgeBaseRequest) returns (KnowledgeBase);
  rpc GetKnowledgeBase(GetKnowledgeBaseRequest) returns (KnowledgeBase);
  rpc ListKnowledgeBases(ListKnowledgeBasesRequest) returns (ListKnowledgeBasesResponse);
  rpc CreateKnowledgeArticle(CreateKnowledgeArticleRequest) returns (KnowledgeArticle);
  rpc UpdateKnowledgeArticle(UpdateKnowledgeArticleRequest) returns (KnowledgeArticle);
  rpc GetKnowledgeArticle(GetKnowledgeArticleRequest) returns (KnowledgeArticle);
  rpc SearchKnowledgeArticles(SearchKnowledgeArticlesRequest) returns (SearchKnowledgeArticlesResponse);
  rpc DeleteKnowledgeArticle(DeleteKnowledgeArticleRequest) returns (google.protobuf.Empty);
  
  rpc StartConversation(StartConversationRequest) returns (Conversation);
  rpc SendMessage(SendMessageRequest) returns (Message);
  rpc GetConversation(GetConversationRequest) returns (Conversation);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc EndConversation(EndConversationRequest) returns (google.protobuf.Empty);
  rpc TransferToHuman(TransferToHumanRequest) returns (TransferToHumanResponse);
  
  rpc GetChatbotResponse(GetChatbotResponseRequest) returns (ChatbotResponse);
  rpc GetQuickReplies(GetQuickRepliesRequest) returns (GetQuickRepliesResponse);
  rpc SubmitFeedback(SubmitFeedbackRequest) returns (google.protobuf.Empty);
  
  rpc AnalyzeSentiment(AnalyzeSentimentRequest) returns (SentimentAnalysis);
  rpc GetIntent(GetIntentRequest) returns (IntentResult);
}

enum ConversationStatus {
  CONVERSATION_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  ENDED = 2;
  TRANSFERRED = 3;
}

enum MessageSender {
  MESSAGE_SENDER_UNSPECIFIED = 0;
  USER = 1;
  BOT = 2;
  AGENT = 3;
}

enum Sentiment {
  SENTIMENT_UNSPECIFIED = 0;
  VERY_NEGATIVE = 1;
  NEGATIVE = 2;
  NEUTRAL = 3;
  POSITIVE = 4;
  VERY_POSITIVE = 5;
}

enum IntentCategory {
  INTENT_CATEGORY_UNSPECIFIED = 0;
  ORDER_INQUIRY = 1;
  PRODUCT_QUESTION = 2;
  RETURN_REFUND = 3;
  PAYMENT_ISSUE = 4;
  SHIPPING_TRACKING = 5;
  ACCOUNT_ISSUE = 6;
  COMPLAINT = 7;
  GENERAL_INQUIRY = 8;
  OTHER = 9;
}

message KnowledgeBase {
  string id = 1;
  string name = 2;
  string description = 3;
  string language = 4;
  bool is_active = 5;
  int32 article_count = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateKnowledgeBaseRequest {
  string name = 1;
  string description = 2;
  string language = 3;
}

message GetKnowledgeBaseRequest {
  string id = 1;
}

message ListKnowledgeBasesRequest {
  bool active_only = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListKnowledgeBasesResponse {
  repeated KnowledgeBase knowledge_bases = 1;
  int32 total = 2;
}

message KnowledgeArticle {
  string id = 1;
  string knowledge_base_id = 2;
  string title = 3;
  string content = 4;
  repeated string keywords = 5;
  repeated string tags = 6;
  string category = 7;
  int32 view_count = 8;
  float helpfulness_score = 9;
  bool is_active = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message CreateKnowledgeArticleRequest {
  string knowledge_base_id = 1;
  string title = 2;
  string content = 3;
  repeated string keywords = 4;
  repeated string tags = 5;
  string category = 6;
}

message UpdateKnowledgeArticleRequest {
  string id = 1;
  string title = 2;
  string content = 3;
  repeated string keywords = 4;
  repeated string tags = 5;
  string category = 6;
  bool is_active = 7;
}

message GetKnowledgeArticleRequest {
  string id = 1;
}

message SearchKnowledgeArticlesRequest {
  string knowledge_base_id = 1;
  string query = 2;
  repeated string tags = 3;
  string category = 4;
  int32 limit = 5;
}

message SearchKnowledgeArticlesResponse {
  repeated KnowledgeArticle articles = 1;
  repeated float scores = 2;
}

message DeleteKnowledgeArticleRequest {
  string id = 1;
}

message Conversation {
  string id = 1;
  uint64 user_id = 2;
  ConversationStatus status = 3;
  repeated Message messages = 4;
  IntentCategory primary_intent = 5;
  Sentiment overall_sentiment = 6;
  string assigned_agent_id = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp ended_at = 9;
  map<string, string> metadata = 10;
}

message Message {
  string id = 1;
  string conversation_id = 2;
  MessageSender sender = 3;
  string content = 4;
  repeated Attachment attachments = 5;
  Sentiment sentiment = 6;
  IntentCategory intent = 7;
  float confidence = 8;
  google.protobuf.Timestamp created_at = 9;
}

message Attachment {
  string id = 1;
  string type = 2;
  string url = 3;
  string name = 4;
}

message StartConversationRequest {
  uint64 user_id = 1;
  string initial_message = 2;
  map<string, string> metadata = 3;
}

message SendMessageRequest {
  string conversation_id = 1;
  string content = 2;
  repeated Attachment attachments = 3;
}

message GetConversationRequest {
  string conversation_id = 1;
}

message ListConversationsRequest {
  uint64 user_id = 1;
  ConversationStatus status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  int32 total = 2;
}

message EndConversationRequest {
  string conversation_id = 1;
  string summary = 2;
}

message TransferToHumanRequest {
  string conversation_id = 1;
  string reason = 2;
  string department = 3;
}

message TransferToHumanResponse {
  bool success = 1;
  string agent_id = 2;
  int32 estimated_wait_seconds = 3;
  string message = 4;
}

message GetChatbotResponseRequest {
  string conversation_id = 1;
  string user_message = 2;
  repeated Message context = 3;
}

message ChatbotResponse {
  string response_text = 1;
  repeated string suggested_articles = 2;
  repeated QuickReply quick_replies = 3;
  bool needs_human_transfer = 4;
  string transfer_reason = 5;
  IntentCategory detected_intent = 6;
  float confidence = 7;
}

message QuickReply {
  string text = 1;
  string payload = 2;
  string type = 3;
}

message GetQuickRepliesRequest {
  string conversation_id = 1;
  IntentCategory intent = 2;
}

message GetQuickRepliesResponse {
  repeated QuickReply quick_replies = 1;
}

message SubmitFeedbackRequest {
  string conversation_id = 1;
  string message_id = 2;
  bool was_helpful = 3;
  int32 rating = 4;
  string comment = 5;
}

message AnalyzeSentimentRequest {
  string text = 1;
}

message SentimentAnalysis {
  Sentiment sentiment = 1;
  float confidence = 2;
  repeated string keywords = 3;
  string explanation = 4;
}

message GetIntentRequest {
  string text = 1;
  repeated Message context = 2;
}

message IntentResult {
  IntentCategory intent = 1;
  float confidence = 2;
  repeated Entity entities = 3;
  string suggested_response = 4;
}

message Entity {
  string type = 1;
  string value = 2;
  int32 start = 3;
  int32 end = 4;
}
