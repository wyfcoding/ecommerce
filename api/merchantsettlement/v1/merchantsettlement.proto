syntax = "proto3";

package merchantsettlement.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/wyfcoding/ecommerce/goapi/merchantsettlement/v1;merchantsettlementv1";

// MerchantSettlementService 商家结算服务
service MerchantSettlementService {
    // GenerateSettlement 为商家生成结算单
    rpc GenerateSettlement(GenerateSettlementRequest) returns (GenerateSettlementResponse);
    
    // GetSettlement 获取结算单详情
    rpc GetSettlement(GetSettlementRequest) returns (GetSettlementResponse);
    
    // ListSettlements 获取结算单列表
    rpc ListSettlements(ListSettlementsRequest) returns (ListSettlementsResponse);
    
    // MarkAsPaid 标记结算单为已支付
    rpc MarkAsPaid(MarkAsPaidRequest) returns (MarkAsPaidResponse);
}

message GenerateSettlementRequest {
    string merchant_id = 1;
    google.protobuf.Timestamp start_date = 2;
    google.protobuf.Timestamp end_date = 3;
}

message GenerateSettlementResponse {
    string settlement_id = 1;
    string amount = 2;
}

message GetSettlementRequest {
    string settlement_id = 1;
}

message GetSettlementResponse {
    SettlementDetail settlement = 1;
}

message SettlementDetail {
    string settlement_id = 1;
    string merchant_id = 2;
    string amount = 3;
    string status = 4; // UNPAID, PAID, FAILED
    google.protobuf.Timestamp period_start = 5;
    google.protobuf.Timestamp period_end = 6;
    google.protobuf.Timestamp created_at = 7;
}

message ListSettlementsRequest {
    string merchant_id = 1;
    string status = 2;
}

message ListSettlementsResponse {
    repeated SettlementDetail settlements = 1;
}

message MarkAsPaidRequest {
    string settlement_id = 1;
    string transaction_ref = 2;
}

message MarkAsPaidResponse {
    bool success = 1;
}
