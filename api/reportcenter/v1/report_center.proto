syntax = "proto3";

package api.reportcenter.v1;

option go_package = "github.com/wyfcoding/ecommerce/go-api/reportcenter/v1;reportcenter";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// ReportCenterService provides APIs for business intelligence and analytics.
service ReportCenterService {
  // Sales Analytics
  rpc GetSalesReport(GetSalesReportRequest) returns (SalesReport) {}
  rpc GetProductPerformance(GetProductPerformanceRequest) returns (ProductPerformanceResponse) {}

  // Inventory Analytics
  rpc GetInventoryHealth(GetInventoryHealthRequest) returns (InventoryHealthReport) {}
  rpc GetLowStockAlerts(google.protobuf.Empty) returns (LowStockAlertsResponse) {}

  // Financial Analytics
  rpc GetFinancialSummary(GetFinancialSummaryRequest) returns (FinancialSummary) {}
  
  // Custom Reports (Asynchronous)
  rpc CreateCustomReport(CreateCustomReportRequest) returns (CustomReport) {}
  rpc GetCustomReport(GetCustomReportRequest) returns (CustomReport) {}
}

message GetSalesReportRequest {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
  string interval = 3; // "hour", "day", "week", "month"
}

message SalesReport {
  double total_revenue = 1;
  int64 total_orders = 2;
  double average_order_value = 3;
  repeated SalesDataPoint data_points = 4;
}

message SalesDataPoint {
  google.protobuf.Timestamp timestamp = 1;
  double revenue = 2;
  int64 orders = 3;
}

message GetProductPerformanceRequest {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
  int32 top_n = 3;
}

message ProductPerformanceResponse {
  repeated ProductPerformance items = 1;
}

message ProductPerformance {
  string product_id = 1;
  string product_name = 2;
  int64 units_sold = 3;
  double revenue = 4;
}

message GetInventoryHealthRequest {
  string category_id = 1;
}

message InventoryHealthReport {
  int64 total_skus = 1;
  int64 out_of_stock_count = 2;
  int64 low_stock_count = 3;
  double total_inventory_value = 4;
}

message LowStockAlertsResponse {
  repeated LowStockAlert alerts = 1;
}

message LowStockAlert {
  string product_id = 1;
  string sku_id = 2;
  string name = 3;
  int64 current_stock = 4;
  int64 threshold = 5;
}

message GetFinancialSummaryRequest {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
}

message FinancialSummary {
  double gross_merchandise_value = 1;
  double total_discounts = 2;
  double net_revenue = 3;
  double total_fees = 4;
  double refund_amount = 5;
}

message CreateCustomReportRequest {
  string report_type = 1;
  string name = 2;
  map<string, string> parameters = 3;
}

enum ReportStatus {
  REPORT_STATUS_UNSPECIFIED = 0;
  REPORT_STATUS_PENDING = 1;
  REPORT_STATUS_PROCESSING = 2;
  REPORT_STATUS_COMPLETED = 3;
  REPORT_STATUS_FAILED = 4;
}

message CustomReport {
  string id = 1;
  string name = 2;
  string report_type = 3;
  ReportStatus status = 4;
  string download_url = 5;
  string error_message = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp completed_at = 8;
}

message GetCustomReportRequest {
  string id = 1;
}
