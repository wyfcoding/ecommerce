// 变更说明：补充订单服务错误码与错误详情定义，便于跨服务统一错误处理。
// 假设：错误码通过 gRPC error details 传递，客户端自行映射为业务提示。
syntax = "proto3";

package api.order.v1;

option go_package = "github.com/wyfcoding/ecommerce/goapi/order/v1;orderv1";

// 订单服务错误码定义。
enum OrderErrorCode {
  ORDER_ERROR_CODE_UNSPECIFIED = 0;
  ORDER_NOT_FOUND = 1; // 订单不存在
  ORDER_STATUS_INVALID = 2; // 订单状态不合法
  ORDER_PAYMENT_FAILED = 3; // 支付失败
  ORDER_STOCK_INSUFFICIENT = 4; // 库存不足
  ORDER_COUPON_INVALID = 5; // 优惠券无效
  ORDER_RISK_REJECTED = 6; // 风控拒绝
  ORDER_DUPLICATED_REQUEST = 7; // 幂等请求重复
  ORDER_SAGA_FAILED = 8; // 分布式事务失败
}

// 标准错误详情结构（可用于 RPC error details）。
message OrderErrorDetail {
  OrderErrorCode code = 1; // 错误码
  string message = 2; // 错误描述
  string trace_id = 3; // 链路追踪 ID
  string request_id = 4; // 请求 ID
}
