syntax = "proto3";

package api.dynamicpricing.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/wyfcoding/ecommerce/go-api/dynamicpricing/v1;dynamicpricingv1";

service DynamicPricingService {
    rpc CalculatePrice(CalculatePriceRequest) returns (CalculatePriceResponse);
    rpc GetLatestPrice(GetLatestPriceRequest) returns (GetLatestPriceResponse);
    rpc GetPriceHistory(GetPriceHistoryRequest) returns (GetPriceHistoryResponse);
    rpc BatchCalculatePrices(BatchCalculatePricesRequest) returns (BatchCalculatePricesResponse);
    rpc PreviewPriceChange(PreviewPriceChangeRequest) returns (PreviewPriceChangeResponse);
    
    rpc CreatePricingStrategy(CreatePricingStrategyRequest) returns (PricingStrategy);
    rpc GetPricingStrategy(GetPricingStrategyRequest) returns (PricingStrategy);
    rpc UpdatePricingStrategy(UpdatePricingStrategyRequest) returns (PricingStrategy);
    rpc DeletePricingStrategy(DeletePricingStrategyRequest) returns (google.protobuf.Empty);
    rpc ListPricingStrategies(ListPricingStrategiesRequest) returns (ListPricingStrategiesResponse);
    rpc ActivateStrategy(ActivateStrategyRequest) returns (ActivateStrategyResponse);
    rpc DeactivateStrategy(DeactivateStrategyRequest) returns (DeactivateStrategyResponse);
    
    rpc CreateRule(CreateRuleRequest) returns (PricingRule);
    rpc GetRule(GetRuleRequest) returns (PricingRule);
    rpc UpdateRule(UpdateRuleRequest) returns (PricingRule);
    rpc DeleteRule(DeleteRuleRequest) returns (google.protobuf.Empty);
    rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
    rpc EvaluateRules(EvaluateRulesRequest) returns (EvaluateRulesResponse);
    rpc GetRuleExecutionLog(GetRuleExecutionLogRequest) returns (GetRuleExecutionLogResponse);
    
    rpc UpdateCompetitorPrice(UpdateCompetitorPriceRequest) returns (google.protobuf.Empty);
    rpc BatchUpdateCompetitorPrices(BatchUpdateCompetitorPricesRequest) returns (BatchUpdateCompetitorPricesResponse);
    rpc GetCompetitorPrices(GetCompetitorPricesRequest) returns (GetCompetitorPricesResponse);
    rpc AnalyzeCompetitorPricing(AnalyzeCompetitorPricingRequest) returns (CompetitorPricingAnalysis);
    rpc GetCompetitorPriceHistory(GetCompetitorPriceHistoryRequest) returns (GetCompetitorPriceHistoryResponse);
    rpc SetCompetitorMonitoringConfig(SetCompetitorMonitoringConfigRequest) returns (CompetitorMonitoringConfig);
    
    rpc CalculatePriceElasticity(CalculatePriceElasticityRequest) returns (PriceElasticityResult);
    rpc GetElasticityCurve(GetElasticityCurveRequest) returns (ElasticityCurve);
    rpc OptimizePriceForRevenue(OptimizePriceForRevenueRequest) returns (PriceOptimizationResult);
    rpc OptimizePriceForProfit(OptimizePriceForProfitRequest) returns (PriceOptimizationResult);
    rpc OptimizePriceForVolume(OptimizePriceForVolumeRequest) returns (PriceOptimizationResult);
    rpc GetPriceOptimizationSuggestions(GetPriceOptimizationSuggestionsRequest) returns (PriceOptimizationSuggestionsResponse);
    
    rpc CreateABTest(CreateABTestRequest) returns (PriceABTest);
    rpc GetABTest(GetABTestRequest) returns (PriceABTest);
    rpc ListABTests(ListABTestsRequest) returns (ListABTestsResponse);
    rpc StartABTest(StartABTestRequest) returns (StartABTestResponse);
    rpc StopABTest(StopABTestRequest) returns (StopABTestResponse);
    rpc GetABTestResults(GetABTestResultsRequest) returns (ABTestResults);
    rpc AssignABTestVariant(AssignABTestVariantRequest) returns (AssignABTestVariantResponse);
    
    rpc SetTimeBasedPricing(SetTimeBasedPricingRequest) returns (TimeBasedPricing);
    rpc GetTimeBasedPricing(GetTimeBasedPricingRequest) returns (TimeBasedPricing);
    rpc ListTimeBasedPricing(ListTimeBasedPricingRequest) returns (ListTimeBasedPricingResponse);
    rpc DeleteTimeBasedPricing(DeleteTimeBasedPricingRequest) returns (google.protobuf.Empty);
    
    rpc SetSegmentPricing(SetSegmentPricingRequest) returns (SegmentPricing);
    rpc GetSegmentPricing(GetSegmentPricingRequest) returns (SegmentPricing);
    rpc ListSegmentPricing(ListSegmentPricingRequest) returns (ListSegmentPricingResponse);
    rpc DeleteSegmentPricing(DeleteSegmentPricingRequest) returns (google.protobuf.Empty);
    
    rpc SetRegionPricing(SetRegionPricingRequest) returns (RegionPricing);
    rpc GetRegionPricing(GetRegionPricingRequest) returns (RegionPricing);
    rpc ListRegionPricing(ListRegionPricingRequest) returns (ListRegionPricingResponse);
    rpc DeleteRegionPricing(DeleteRegionPricingRequest) returns (google.protobuf.Empty);
    
    rpc SetChannelPricing(SetChannelPricingRequest) returns (ChannelPricing);
    rpc GetChannelPricing(GetChannelPricingRequest) returns (ChannelPricing);
    rpc ListChannelPricing(ListChannelPricingRequest) returns (ListChannelPricingResponse);
    rpc DeleteChannelPricing(DeleteChannelPricingRequest) returns (google.protobuf.Empty);
    
    rpc SetPromotionPricing(SetPromotionPricingRequest) returns (PromotionPricing);
    rpc GetPromotionPricing(GetPromotionPricingRequest) returns (PromotionPricing);
    rpc ListPromotionPricing(ListPromotionPricingRequest) returns (ListPromotionPricingResponse);
    rpc DeletePromotionPricing(DeletePromotionPricingRequest) returns (google.protobuf.Empty);
    
    rpc CreatePriceMonitor(CreatePriceMonitorRequest) returns (PriceMonitor);
    rpc GetPriceMonitor(GetPriceMonitorRequest) returns (PriceMonitor);
    rpc ListPriceMonitors(ListPriceMonitorsRequest) returns (ListPriceMonitorsResponse);
    rpc DeletePriceMonitor(DeletePriceMonitorRequest) returns (google.protobuf.Empty);
    rpc GetPriceAlerts(GetPriceAlertsRequest) returns (GetPriceAlertsResponse);
    rpc AcknowledgePriceAlert(AcknowledgePriceAlertRequest) returns (AcknowledgePriceAlertResponse);
    
    rpc GetPricingDashboard(GetPricingDashboardRequest) returns (PricingDashboard);
    rpc GetPricingMetrics(GetPricingMetricsRequest) returns (PricingMetrics);
    rpc GetPricingReport(GetPricingReportRequest) returns (PricingReport);
    rpc ExportPricingData(ExportPricingDataRequest) returns (ExportPricingDataResponse);
    
    rpc SetMLPricingConfig(SetMLPricingConfigRequest) returns (MLPricingConfig);
    rpc GetMLPricingConfig(GetMLPricingConfigRequest) returns (MLPricingConfig);
    rpc TrainPricingModel(TrainPricingModelRequest) returns (TrainPricingModelResponse);
    rpc GetModelPerformance(GetModelPerformanceRequest) returns (ModelPerformance);
    rpc GetMLPriceRecommendation(GetMLPriceRecommendationRequest) returns (MLPriceRecommendation);
    
    rpc CreatePriceBook(CreatePriceBookRequest) returns (PriceBook);
    rpc GetPriceBook(GetPriceBookRequest) returns (PriceBook);
    rpc ListPriceBooks(ListPriceBooksRequest) returns (ListPriceBooksResponse);
    rpc UpdatePriceBook(UpdatePriceBookRequest) returns (PriceBook);
    rpc DeletePriceBook(DeletePriceBookRequest) returns (google.protobuf.Empty);
    rpc AddPriceBookEntry(AddPriceBookEntryRequest) returns (PriceBookEntry);
    rpc RemovePriceBookEntry(RemovePriceBookEntryRequest) returns (google.protobuf.Empty);
    rpc GetPriceFromBook(GetPriceFromBookRequest) returns (GetPriceFromBookResponse);
    
    rpc ApplyPriceChange(ApplyPriceChangeRequest) returns (ApplyPriceChangeResponse);
    rpc BatchApplyPriceChanges(BatchApplyPriceChangesRequest) returns (BatchApplyPriceChangesResponse);
    rpc RollbackPriceChange(RollbackPriceChangeRequest) returns (RollbackPriceChangeResponse);
    rpc GetPriceChangeHistory(GetPriceChangeHistoryRequest) returns (GetPriceChangeHistoryResponse);
    
    rpc SubscribePriceUpdates(SubscribePriceUpdatesRequest) returns (stream PriceUpdateEvent);
    rpc SubscribeCompetitorUpdates(SubscribeCompetitorUpdatesRequest) returns (stream CompetitorUpdateEvent);
    rpc SubscribePriceAlerts(SubscribePriceAlertsRequest) returns (stream PriceAlertEvent);
}

enum StrategyType {
    STRATEGY_TYPE_UNSPECIFIED = 0;
    STRATEGY_TYPE_INVENTORY_BASED = 1;
    STRATEGY_TYPE_DEMAND_BASED = 2;
    STRATEGY_TYPE_COMPETITOR_BASED = 3;
    STRATEGY_TYPE_TIME_BASED = 4;
    STRATEGY_TYPE_SEGMENT_BASED = 5;
    STRATEGY_TYPE_REGION_BASED = 6;
    STRATEGY_TYPE_CHANNEL_BASED = 7;
    STRATEGY_TYPE_PROMOTION_BASED = 8;
    STRATEGY_TYPE_ML_BASED = 9;
    STRATEGY_TYPE_HYBRID = 10;
    STRATEGY_TYPE_COST_PLUS = 11;
    STRATEGY_TYPE_VALUE_BASED = 12;
    STRATEGY_TYPE_PENETRATION = 13;
    STRATEGY_TYPE_SKIMMING = 14;
    STRATEGY_TYPE_PREMIUM = 15;
    STRATEGY_TYPE_ECONOMY = 16;
    STRATEGY_TYPE_BUNDLE = 17;
    STRATEGY_TYPE_PSYCHOLOGICAL = 18;
}

enum RuleCondition {
    RULE_CONDITION_UNSPECIFIED = 0;
    RULE_CONDITION_INVENTORY_BELOW = 1;
    RULE_CONDITION_INVENTORY_ABOVE = 2;
    RULE_CONDITION_DEMAND_BELOW = 3;
    RULE_CONDITION_DEMAND_ABOVE = 4;
    RULE_CONDITION_COMPETITOR_PRICE_BELOW = 5;
    RULE_CONDITION_COMPETITOR_PRICE_ABOVE = 6;
    RULE_CONDITION_TIME_OF_DAY = 7;
    RULE_CONDITION_DAY_OF_WEEK = 8;
    RULE_CONDITION_HOLIDAY = 9;
    RULE_CONDITION_SALES_VELOCITY = 10;
    RULE_CONDITION_MARGIN_BELOW = 11;
    RULE_CONDITION_MARGIN_ABOVE = 12;
    RULE_CONDITION_CONVERSION_RATE = 13;
    RULE_CONDITION_CART_ABANDONMENT = 14;
    RULE_CONDITION_USER_SEGMENT = 15;
    RULE_CONDITION_REGION = 16;
    RULE_CONDITION_CHANNEL = 17;
    RULE_CONDITION_WEATHER = 18;
    RULE_CONDITION_EVENT = 19;
}

enum RuleAction {
    RULE_ACTION_UNSPECIFIED = 0;
    RULE_ACTION_ADJUST_PERCENTAGE = 1;
    RULE_ACTION_ADJUST_FIXED = 2;
    RULE_ACTION_SET_PRICE = 3;
    RULE_ACTION_SET_TO_COMPETITOR = 4;
    RULE_ACTION_SET_TO_MIN = 5;
    RULE_ACTION_SET_TO_MAX = 6;
    RULE_ACTION_APPLY_DISCOUNT = 7;
    RULE_ACTION_REMOVE_DISCOUNT = 8;
    RULE_ACTION_ROUND_PRICE = 9;
    RULE_ACTION_APPLY_MARKUP = 10;
}

enum PriceStatus {
    PRICE_STATUS_UNSPECIFIED = 0;
    PRICE_STATUS_ACTIVE = 1;
    PRICE_STATUS_SCHEDULED = 2;
    PRICE_STATUS_EXPIRED = 3;
    PRICE_STATUS_DRAFT = 4;
    PRICE_STATUS_ARCHIVED = 5;
}

enum ABTestStatus {
    AB_TEST_STATUS_UNSPECIFIED = 0;
    AB_TEST_STATUS_DRAFT = 1;
    AB_TEST_STATUS_RUNNING = 2;
    AB_TEST_STATUS_PAUSED = 3;
    AB_TEST_STATUS_COMPLETED = 4;
    AB_TEST_STATUS_CANCELLED = 5;
}

enum AlertType {
    ALERT_TYPE_UNSPECIFIED = 0;
    ALERT_TYPE_PRICE_TOO_LOW = 1;
    ALERT_TYPE_PRICE_TOO_HIGH = 2;
    ALERT_TYPE_MARGIN_BELOW_THRESHOLD = 3;
    ALERT_TYPE_COMPETITOR_PRICE_DROP = 4;
    ALERT_TYPE_COMPETITOR_PRICE_RISE = 5;
    ALERT_TYPE_INVENTORY_LOW = 6;
    ALERT_TYPE_DEMAND_SPIKE = 7;
    ALERT_TYPE_DEMAND_DROP = 8;
    ALERT_TYPE_RULE_TRIGGERED = 9;
    ALERT_TYPE_STRATEGY_CHANGE = 10;
    ALERT_TYPE_ANOMALY_DETECTED = 11;
}

enum MonitorType {
    MONITOR_TYPE_UNSPECIFIED = 0;
    MONITOR_TYPE_PRICE_THRESHOLD = 1;
    MONITOR_TYPE_MARGIN_THRESHOLD = 2;
    MONITOR_TYPE_COMPETITOR_CHANGE = 3;
    MONITOR_TYPE_DEMAND_CHANGE = 4;
    MONITOR_TYPE_INVENTORY_CHANGE = 5;
    MONITOR_TYPE_CONVERSION_RATE = 6;
    MONITOR_TYPE_ANOMALY = 7;
}

message DynamicPrice {
    string price_id = 1;
    string sku_id = 2;
    string product_id = 3;
    string base_price = 4;
    string final_price = 5;
    string original_price = 6;
    string cost_price = 7;
    string price_adjustment = 8;
    string adjustment_percentage = 9;
    string inventory_factor = 10;
    string demand_factor = 11;
    string competitor_factor = 12;
    string time_factor = 13;
    string segment_factor = 14;
    string region_factor = 15;
    string channel_factor = 16;
    string promotion_factor = 17;
    string ml_factor = 18;
    string margin = 19;
    string margin_percentage = 20;
    PriceStatus status = 21;
    google.protobuf.Timestamp effective_time = 22;
    google.protobuf.Timestamp expiry_time = 23;
    string strategy_id = 24;
    repeated string applied_rules = 25;
    map<string, string> metadata = 26;
    google.protobuf.Timestamp created_at = 27;
    google.protobuf.Timestamp updated_at = 28;
}

message CalculatePriceRequest {
    string sku_id = 1;
    string product_id = 2;
    string base_price = 3;
    string cost_price = 4;
    string current_stock = 5;
    string total_stock = 6;
    string daily_demand = 7;
    string average_daily_demand = 8;
    string competitor_price = 9;
    string user_segment = 10;
    string region = 11;
    string channel = 12;
    repeated string applied_promotions = 13;
    map<string, string> context = 14;
}

message CalculatePriceResponse {
    DynamicPrice price = 1;
    repeated PricingFactor factors = 2;
    repeated string recommendations = 3;
}

message PricingFactor {
    string name = 1;
    string value = 2;
    string impact = 3;
    string description = 4;
}

message GetLatestPriceRequest {
    string sku_id = 1;
    string user_segment = 2;
    string region = 3;
    string channel = 4;
}

message GetLatestPriceResponse {
    DynamicPrice price = 1;
}

message PriceHistoryEntry {
    string price_id = 1;
    string sku_id = 2;
    string price = 3;
    string previous_price = 4;
    string change_amount = 5;
    string change_percentage = 6;
    string reason = 7;
    string strategy_id = 8;
    repeated string triggered_rules = 9;
    google.protobuf.Timestamp effective_at = 10;
    google.protobuf.Timestamp created_at = 11;
}

message GetPriceHistoryRequest {
    string sku_id = 1;
    google.protobuf.Timestamp from = 2;
    google.protobuf.Timestamp to = 3;
    int32 page_size = 4;
    string page_token = 5;
}

message GetPriceHistoryResponse {
    repeated PriceHistoryEntry entries = 1;
    string next_page_token = 2;
    int32 total_count = 3;
}

message BatchCalculatePricesRequest {
    repeated CalculatePriceRequest requests = 1;
}

message BatchCalculatePricesResponse {
    repeated CalculatePriceResponse results = 1;
    repeated string errors = 2;
}

message PreviewPriceChangeRequest {
    string sku_id = 1;
    string new_price = 2;
    string reason = 3;
}

message PreviewPriceChangeResponse {
    string current_price = 1;
    string new_price = 2;
    string change_amount = 3;
    string change_percentage = 4;
    string projected_margin = 5;
    string projected_margin_change = 6;
    string projected_demand_change = 7;
    string projected_revenue_change = 8;
    repeated string warnings = 9;
    repeated string recommendations = 10;
}

message PricingStrategy {
    string strategy_id = 1;
    string name = 2;
    string description = 3;
    StrategyType strategy_type = 4;
    string sku_id = 5;
    string product_id = 6;
    string category_id = 7;
    string min_price = 8;
    string max_price = 9;
    string target_margin = 10;
    string inventory_threshold = 11;
    string demand_threshold = 12;
    string competitor_price_offset = 13;
    string competitor_price_percentage = 14;
    map<string, string> parameters = 15;
    repeated PricingRule rules = 16;
    bool enabled = 17;
    int32 priority = 18;
    google.protobuf.Timestamp start_time = 19;
    google.protobuf.Timestamp end_time = 20;
    google.protobuf.Timestamp created_at = 21;
    google.protobuf.Timestamp updated_at = 22;
    map<string, string> metadata = 23;
}

message PricingRule {
    string rule_id = 1;
    string name = 2;
    string description = 3;
    RuleCondition condition = 4;
    string condition_value = 5;
    string condition_operator = 6;
    RuleAction action = 7;
    string action_value = 8;
    int32 priority = 9;
    bool enabled = 10;
    google.protobuf.Timestamp created_at = 11;
    google.protobuf.Timestamp updated_at = 12;
}

message CreatePricingStrategyRequest {
    string name = 1;
    string description = 2;
    StrategyType strategy_type = 3;
    string sku_id = 4;
    string product_id = 5;
    string category_id = 6;
    string min_price = 7;
    string max_price = 8;
    string target_margin = 9;
    string inventory_threshold = 10;
    string demand_threshold = 11;
    string competitor_price_offset = 12;
    string competitor_price_percentage = 13;
    map<string, string> parameters = 14;
    repeated PricingRule rules = 15;
    int32 priority = 16;
    google.protobuf.Timestamp start_time = 17;
    google.protobuf.Timestamp end_time = 18;
    map<string, string> metadata = 19;
}

message GetPricingStrategyRequest {
    string strategy_id = 1;
}

message UpdatePricingStrategyRequest {
    string strategy_id = 1;
    string name = 2;
    string description = 3;
    string min_price = 4;
    string max_price = 5;
    string target_margin = 6;
    string inventory_threshold = 7;
    string demand_threshold = 8;
    string competitor_price_offset = 9;
    string competitor_price_percentage = 10;
    map<string, string> parameters = 11;
    repeated PricingRule rules = 12;
    int32 priority = 13;
    google.protobuf.Timestamp start_time = 14;
    google.protobuf.Timestamp end_time = 15;
    map<string, string> metadata = 16;
}

message DeletePricingStrategyRequest {
    string strategy_id = 1;
}

message ListPricingStrategiesRequest {
    string sku_id = 1;
    string product_id = 2;
    string category_id = 3;
    StrategyType strategy_type = 4;
    bool enabled_only = 5;
    int32 page_size = 6;
    string page_token = 7;
}

message ListPricingStrategiesResponse {
    repeated PricingStrategy strategies = 1;
    string next_page_token = 2;
    int32 total_count = 3;
}

message ActivateStrategyRequest {
    string strategy_id = 1;
}

message ActivateStrategyResponse {
    PricingStrategy strategy = 1;
    bool success = 2;
    string message = 3;
}

message DeactivateStrategyRequest {
    string strategy_id = 1;
}

message DeactivateStrategyResponse {
    PricingStrategy strategy = 1;
    bool success = 2;
    string message = 3;
}

message CreateRuleRequest {
    string strategy_id = 1;
    string name = 2;
    string description = 3;
    RuleCondition condition = 4;
    string condition_value = 5;
    string condition_operator = 6;
    RuleAction action = 7;
    string action_value = 8;
    int32 priority = 9;
}

message GetRuleRequest {
    string rule_id = 1;
}

message UpdateRuleRequest {
    string rule_id = 1;
    string name = 2;
    string description = 3;
    RuleCondition condition = 4;
    string condition_value = 5;
    string condition_operator = 6;
    RuleAction action = 7;
    string action_value = 8;
    int32 priority = 9;
    bool enabled = 10;
}

message DeleteRuleRequest {
    string rule_id = 1;
}

message ListRulesRequest {
    string strategy_id = 1;
    bool enabled_only = 2;
    int32 page_size = 3;
    string page_token = 4;
}

message ListRulesResponse {
    repeated PricingRule rules = 1;
    string next_page_token = 2;
    int32 total_count = 3;
}

message EvaluateRulesRequest {
    string sku_id = 1;
    string current_price = 2;
    string inventory = 3;
    string demand = 4;
    string competitor_price = 5;
    map<string, string> context = 6;
}

message EvaluateRulesResponse {
    repeated RuleEvaluationResult results = 1;
    string recommended_price = 2;
    repeated string applied_rules = 3;
}

message RuleEvaluationResult {
    string rule_id = 1;
    string rule_name = 2;
    bool triggered = 3;
    string condition_result = 4;
    string action_result = 5;
    string price_adjustment = 6;
}

message RuleExecutionLog {
    string log_id = 1;
    string rule_id = 2;
    string sku_id = 3;
    bool triggered = 4;
    string condition_value = 5;
    string action_taken = 6;
    string price_before = 7;
    string price_after = 8;
    google.protobuf.Timestamp executed_at = 9;
}

message GetRuleExecutionLogRequest {
    string rule_id = 1;
    string sku_id = 2;
    google.protobuf.Timestamp from = 3;
    google.protobuf.Timestamp to = 4;
    int32 page_size = 5;
    string page_token = 6;
}

message GetRuleExecutionLogResponse {
    repeated RuleExecutionLog logs = 1;
    string next_page_token = 2;
    int32 total_count = 3;
}

message CompetitorPrice {
    string competitor_price_id = 1;
    string sku_id = 2;
    string competitor_name = 3;
    string competitor_product_id = 4;
    string price = 5;
    string original_price = 6;
    string discount = 7;
    string currency = 8;
    string url = 9;
    bool in_stock = 10;
    string shipping_cost = 11;
    string total_price = 12;
    string price_position = 13;
    google.protobuf.Timestamp captured_at = 14;
    google.protobuf.Timestamp created_at = 15;
    map<string, string> metadata = 16;
}

message UpdateCompetitorPriceRequest {
    string sku_id = 1;
    string competitor_name = 2;
    string price = 3;
    string url = 4;
    string competitor_product_id = 5;
    string original_price = 6;
    string shipping_cost = 7;
    bool in_stock = 8;
    string currency = 9;
    map<string, string> metadata = 10;
}

message BatchUpdateCompetitorPricesRequest {
    repeated UpdateCompetitorPriceRequest updates = 1;
}

message BatchUpdateCompetitorPricesResponse {
    int32 success_count = 1;
    int32 failure_count = 2;
    repeated string errors = 3;
}

message GetCompetitorPricesRequest {
    string sku_id = 1;
    repeated string competitor_names = 2;
    google.protobuf.Timestamp since = 3;
}

message GetCompetitorPricesResponse {
    repeated CompetitorPrice prices = 1;
    string lowest_price = 2;
    string highest_price = 3;
    string average_price = 4;
    string our_price = 5;
    string price_position = 6;
}

message CompetitorPricingAnalysis {
    string sku_id = 1;
    string our_price = 2;
    string market_average = 3;
    string market_lowest = 4;
    string market_highest = 5;
    string price_percentile = 6;
    string recommended_price = 7;
    repeated CompetitorInsight insights = 8;
