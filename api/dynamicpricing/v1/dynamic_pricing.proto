    string config_id = 1;
    string sku_id = 2;
    repeated string competitors = 3;
    string monitoring_frequency = 4;
    bool enabled = 5;
    string alert_threshold_percentage = 6;
    repeated AlertType alert_types = 7;
    google.protobuf.Timestamp last_monitored = 8;
    google.protobuf.Timestamp created_at = 9;
    google.protobuf.Timestamp updated_at = 10;
}

message SetCompetitorMonitoringConfigRequest {
    string sku_id = 1;
    repeated string competitors = 2;
    string monitoring_frequency = 3;
    bool enabled = 4;
    string alert_threshold_percentage = 5;
    repeated AlertType alert_types = 6;
}

message PriceElasticityResult {
    string sku_id = 1;
    string elasticity_coefficient = 2;
    string elasticity_type = 3;
    string demand_change_per_1_percent_price_change = 4;
    string revenue_impact = 5;
    string confidence_level = 6;
    int32 data_points = 7;
    google.protobuf.Duration analysis_period = 8;
    repeated ElasticitySegment segments = 9;
}

message ElasticitySegment {
    string price_range_low = 1;
    string price_range_high = 2;
    string elasticity = 3;
    string demand_estimate = 4;
    string revenue_estimate = 5;
}

message CalculatePriceElasticityRequest {
    string sku_id = 1;
    google.protobuf.Duration analysis_period = 2;
    int32 min_data_points = 3;
}

message ElasticityCurve {
    string sku_id = 1;
    repeated ElasticityPoint points = 2;
    string optimal_price = 3;
    string optimal_demand = 4;
    string optimal_revenue = 5;
}

message ElasticityPoint {
    string price = 1;
    string demand = 2;
    string revenue = 3;
    string elasticity = 4;
}

message GetElasticityCurveRequest {
    string sku_id = 1;
    string price_range_low = 2;
    string price_range_high = 3;
    int32 num_points = 4;
}

message PriceOptimizationResult {
    string sku_id = 1;
    string current_price = 2;
    string optimized_price = 3;
    string price_change = 4;
    string price_change_percentage = 5;
    string expected_demand_change = 6;
