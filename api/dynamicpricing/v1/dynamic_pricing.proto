}

message CompetitorInsight {
    string competitor_name = 1;
    string price = 2;
    string price_difference = 3;
    string price_difference_percentage = 4;
    string trend = 5;
    string recommendation = 6;
}

message AnalyzeCompetitorPricingRequest {
    string sku_id = 1;
    repeated string competitor_names = 2;
    int32 lookback_days = 3;
}

message GetCompetitorPriceHistoryRequest {
    string sku_id = 1;
    string competitor_name = 2;
    google.protobuf.Timestamp from = 3;
    google.protobuf.Timestamp to = 4;
    int32 page_size = 5;
    string page_token = 6;
}

message GetCompetitorPriceHistoryResponse {
    repeated CompetitorPrice prices = 1;
    string next_page_token = 2;
    int32 total_count = 3;
}

