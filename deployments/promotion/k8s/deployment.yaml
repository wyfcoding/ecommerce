# 变更说明：
# 促销（Promotion）引擎作为结算大脑。
# CPU 的耗费达到峰值，通过 Resource requests 建立强大的 QOS(Quality of Service)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion
  namespace: e-commerce
  labels:
    app: promotion
spec:
  replicas: 4
  selector:
    matchLabels:
      app: promotion
  template:
    metadata:
      labels:
        app: promotion
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - name: promotion
        image: registry.example.com/ecommerce/promotion:latest
        ports:
        - containerPort: 8086
          name: http
        - containerPort: 9096
          name: grpc
        # Prometheus 原生监控挂载抓包，把每秒优惠发了多少钱报表投向上界
        env:
          - name: GOGC
            value: "200" # 调大触发垃圾回收阀值，让 Golang 大量计算促销图的时候别 GC 卡顿挂掉
        resources:
          requests:
            cpu: 1000m
            memory: 1Gi
          limits:
            cpu: 4000m
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8086
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: promotion-svc
  namespace: e-commerce
spec:
  selector:
    app: promotion
  ports:
  - name: http
    port: 80
    targetPort: 8086
  - name: grpc
    port: 9096
    targetPort: 9096
