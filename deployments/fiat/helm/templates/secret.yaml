apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fiat.fullname" . }}-secrets
  labels:
    {{- include "fiat.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.dbPassword }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.paymentGatewayApiKey }}
  PAYMENT_GATEWAY_API_KEY: {{ .Values.secrets.paymentGatewayApiKey | b64enc | quote }}
  {{- end }}
