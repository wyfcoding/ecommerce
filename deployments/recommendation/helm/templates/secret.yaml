apiVersion: v1
kind: Secret
metadata:
  name: {{ include "recommendation.fullname" . }}-secrets
  labels:
    {{- include "recommendation.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.dbPassword }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.mlflowTrackingUri }}
  MLFLOW_TRACKING_URI: {{ .Values.secrets.mlflowTrackingUri | b64enc | quote }}
  {{- end }}
