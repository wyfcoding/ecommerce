apiVersion: v1
kind: Secret
metadata:
  name: {{ include "insurance.fullname" . }}-secrets
  labels:
    {{- include "insurance.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.dbPassword }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtSecret }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.insuranceProviderApiKey }}
  INSURANCE_PROVIDER_API_KEY: {{ .Values.secrets.insuranceProviderApiKey | b64enc | quote }}
  {{- end }}
